[package]
name = "woc-app"
description = "Tauri shell for WoC Player Count: SNI tray, dashboard window lifecycle, notifications."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "woc-widget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.3"
tray-icon = { version = "=0.24.1", default-features = false, features = ["gtk"] }
libappindicator = "=0.9.0"
notify-rust = "4.18.0"
wockit = { path = "../wockit" }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
# Already in the tree via tauri/gtk; direct dep only to set the GLib application name,
# which libayatana surfaces as the SNI Title (otherwise it shows the binary name).
glib = "0.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
libc = "0.2"
cosmic-config = { git = "https://github.com/pop-os/libcosmic.git", rev = "6359a9465b8fe4c3b0ada0cd2b87cddf644ca732", default-features = false }
