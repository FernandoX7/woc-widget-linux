[package]
name = "wockit"
description = "Domain logic for WoC Player Count: API clients, history store, alert engine, label formatting. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
# default-features minus `charset`: this transport reads raw bytes (never
# Response::text()), so encoding_rs would be dead supply-chain weight.
reqwest = { version = "0.13.4", default-features = false, features = ["default-tls", "http2", "system-proxy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
