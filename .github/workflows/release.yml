name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-packages:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libssl-dev
          libgtk-3-dev librsvg2-dev libxdo-dev pkg-config
          libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: woc-app/ui/package-lock.json
      - name: Install UI dependencies
        working-directory: woc-app/ui
        run: npm ci
      - name: Build Debian and AppImage packages
        working-directory: woc-app
        run: ui/node_modules/.bin/tauri build --bundles deb,appimage
      - name: Collect assets and checksums
        run: |
          mkdir release-assets
          cp target/release/bundle/deb/*.deb release-assets/
          cp target/release/bundle/appimage/*.AppImage release-assets/
          cd release-assets
          sha256sum -- * > SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --prerelease --verify-tag
          --title "WoC Player Count $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
