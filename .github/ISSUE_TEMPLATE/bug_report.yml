name: Bug report
description: Report a reproducible problem in WoC Player Count for Linux.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, wallet data, private messages, or unredacted desktop screenshots. Report security issues through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Distribution and desktop/session
      placeholder: Pop!_OS 24.04, COSMIC, Wayland
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options: [Source, Debian package, AppImage, Flatpak, COSMIC applet, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence and whether it reproduces after restart.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove usernames, home paths, hostnames, messages, tokens, and unrelated desktop content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed all attachments and text for sensitive or unrelated personal information.
          required: true
