name: Feature request
description: Suggest a focused improvement for the Linux companion.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or Linux desktop limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Relevant distribution/desktop
      placeholder: Cross-desktop, GNOME, KDE, COSMIC, etc.
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives and tradeoffs
      description: Note privacy, network, packaging, or desktop-integration impact.
