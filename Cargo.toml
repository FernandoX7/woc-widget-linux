[workspace]
resolver = "2"
members = ["wockit", "woc-app", "woc-cosmic-applet"]

[patch.crates-io]
libappindicator = { path = "vendor/libappindicator" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/FernandoX7/woc-widget-linux"

[profile.release]
codegen-units = 1
lto = true
strip = true
