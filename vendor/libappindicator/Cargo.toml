[package]
edition = "2021"
name = "libappindicator"
version = "0.9.0"
description = "Pinned libappindicator binding with a shared label-guide setter"
license = "Apache-2.0 OR MIT"

[dependencies]
glib = "0.18"
gtk = "0.18"
gtk-sys = "0.18"
libappindicator-sys = "0.9"
log = "0.4"

[features]
backcompat = ["libappindicator-sys/backcompat"]
default = ["backcompat"]
